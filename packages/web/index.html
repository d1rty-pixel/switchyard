<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Switchyard</title>
    <script>
      // Applied before paint, and before React mounts, so there is no
      // flash of the wrong theme while the bundle loads.
      (function () {
        var stored = localStorage.getItem('switchyard-theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1016'/%3E%3Cpath d='M5 16h7l7-7h8' stroke='%232ee6c5' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Cpath d='M12 16l7 7h8' stroke='%237c8cff' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='12' cy='16' r='3' fill='%230b1016' stroke='%232ee6c5' stroke-width='2.5'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
