# Switchyard main configuration.
#
# This file holds only global settings and group definitions. Services live in
# one file per service under `services.d/`, which is picked up automatically.
#
# Everything Switchyard reads here is TRUSTED input: argv arrays in service
# files are executed as the user running Switchyard. Treat these files like
# systemd unit files. The browser can never send a command — it can only name a
# service id and an action id that already exist in this configuration.

version: 1

settings:
  host: 127.0.0.1 # loopback default; switchyard-manage.sh may override via --host
  port: 7878
  # Lets switchyard-manage.sh bind to the docker0 bridge IP when it detects
  # Docker, so containers (e.g. Traefik) can reach it. Still refuses anything
  # non-loopback unless --host is explicitly passed — this only lifts the
  # guard, it doesn't widen the default. No auth on this app: anything that
  # can reach it can control every service it manages.
  allowRemoteBind: true
  statusIntervalMs: 6000 # background status poll
  commandTimeoutMs: 30000 # default per-command timeout
  logsTail: 200
  historyLimit: 25
  statusConcurrency: 4

# Resource monitoring defaults. Sampling runs on its own interval, separate from
# the status poll above, because CPU and I/O rates are differences between two
# readings. Thresholds live per service (see services.d/*.yaml); without any,
# services are sampled for display only and never alert.
#
# Thresholds are ABSOLUTE per-service values, not a share of the machine, so they
# only mean something relative to the host they were written for. Record the host
# whenever you tune them:
#
#   this host: 14 CPU threads (so 1400 % is everything), 30 GiB RAM
#
#   cpu:    100 % is one fully busy core, exactly as in `top` and `docker stats`.
#           A `warning: 400%` that leaves plenty of headroom here would be
#           "the whole box" on a 4-thread VM.
#   memory: absolute bytes. A 2 GiB warning is 7 % of this machine and 50 % of a
#           4 GiB VM.
#
# Moving a service definition to a smaller or larger machine therefore means
# re-deriving its thresholds — take a fresh idle baseline from the dashboard,
# then set the warning just above it and the critical at the point where the
# service is taking a share of the host you would want to be told about.
monitoring:
  interval: 15s # sampling interval
  for: 30s # default time a threshold must stay exceeded before alerting
  clearBelow: 0.9 # clear only below threshold × 0.9, so a value on the line cannot flap
  cooldown: 5m # minimum gap between repeat notifications per service and metric

# Directories scanned for per-service files (*.yaml / *.yml, non-recursive).
# Defaults to ./services.d when the key is omitted; listed here for clarity.
serviceDirs:
  - services.d

groups:
  - id: web
    name: Web
    description: HTTP entry points and reverse proxies
    icon: globe
    order: 10
  - id: containers
    name: Containers
    description: Compose projects and container workloads
    icon: container
    order: 20
  - id: infrastructure
    name: Infrastructure
    description: System-level daemons
    icon: server-cog
    order: 30
  - id: development
    name: Development
    description: Local development helpers
    icon: code
    order: 40
  - id: other
    name: Other
    order: 90
