# A custom nginx instance with its own prefix, config, pid file and logs.
#
# Runs entirely as your own user: unprivileged port 8480, nothing outside the
# repository, no sudo. Works in a fresh clone without editing — `workdir` points
# at the repository root and every path below is relative to it.
#
# Pattern worth stealing: the pid file decides running/stopped, while `nginx -t`
# grades the health of a live process. A process that is up with a broken config
# therefore shows as "degraded" instead of a confident green.

id: nginx-local
name: nginx (local)
description: Unprivileged nginx instance with its own prefix and configuration
icon: globe
type: command
group: web
tags: [http, nginx, example]
enabled: true

# Relative workdir resolves against the directory holding this file.
workdir: ..

urls:
  - label: switchyard.localhost
    url: http://127.0.0.1:8480/
    primary: true
  - label: health
    url: http://127.0.0.1:8480/healthz
ports:
  - port: 8480
    label: http

# Resource thresholds. The `command` provider samples through `/proc` using the
# pid file below, so it measures **the master process only** — nginx worker
# processes are not counted. The drawer states that on every sample. A service
# whose real work happens in children is better modelled as a systemd unit, where
# the cgroup covers the whole tree.
#
# Without a `pidFile` this provider has nothing to sample and thresholds here
# would never fire.
monitoring:
  cpu:
    warning: 80%
    for: 30s
  memory:
    warning: 256MiB
    critical: 512MiB
  diskWrite:
    warning: 20MiB/s
    for: 30s

provider:
  # Relative pid files resolve against `workdir`.
  pidFile: examples/nginx/run/nginx.pid
  status:
    run: [nginx, -p, examples/nginx, -c, nginx.conf, -t]
    interpret: exit
    successState: running
    failureState: degraded
  logs:
    run: [tail, examples/nginx/logs/error.log]
    tailArg: -n
    source: nginx error.log
  actions:
    - id: start
      label: Start
      kind: primary
      run: [nginx, -p, examples/nginx, -c, nginx.conf]
      successMessage: nginx started on 127.0.0.1:8480
      enabledIn: [stopped, failed, unknown]
    - id: stop
      label: Stop
      kind: danger
      confirm: true
      run: [nginx, -p, examples/nginx, -c, nginx.conf, -s, quit]
      enabledIn: [running, degraded]
    - id: reload
      label: Reload
      kind: secondary
      run: [nginx, -p, examples/nginx, -c, nginx.conf, -s, reload]
      successMessage: configuration reloaded without dropping connections
      enabledIn: [running, degraded]
    - id: test
      label: Test config
      kind: utility
      icon: shield-check
      description: nginx -t against this instance's configuration
      run: [nginx, -p, examples/nginx, -c, nginx.conf, -t]
