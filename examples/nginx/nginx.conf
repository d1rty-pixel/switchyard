# Example of a *custom* nginx instance managed by Switchyard.
#
# It runs entirely as your own user: unprivileged port, own prefix, own pid file
# and logs. Nothing here needs root or sudo.
#
#   start:  nginx -p <prefix> -c <prefix>/nginx.conf
#   reload: nginx -p <prefix> -c <prefix>/nginx.conf -s reload
#   test:   nginx -p <prefix> -c <prefix>/nginx.conf -t
#
# All paths below are relative to the prefix passed with -p.

worker_processes 1;
daemon on;
pid run/nginx.pid;
error_log logs/error.log info;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log logs/access.log;
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    sendfile on;
    keepalive_timeout 30;

    server {
        listen 127.0.0.1:8480;
        server_name switchyard.localhost;

        root html;
        index index.html;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
