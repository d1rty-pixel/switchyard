# Shipped default: Switchyard managing itself.
#
# The one file in `services.d/` that is tracked in git (see the negation in
# .gitignore) — it is what keeps a fresh checkout from opening on an empty
# dashboard. It needs no privileges, no Docker and no systemd, and every path in
# it is relative to this file, so it works in any checkout on any machine.
#
# Everything else you add to this directory stays local and untracked. Delete this
# file, or set `enabled: false` below, if you would rather not see it.
#
# The `command` provider drives `scripts/switchyard-manage.sh`: `npm start` runs
# the server in the foreground, so the script detaches it with setsid and tracks
# it through a pid file, the same way 11-worker-script.yaml handles the sample
# worker.
#
# CAUTION: `stop`/`restart` kill the process handling the very request that
# triggered them. The HTTP response usually still makes it out before the
# SIGTERM lands, but this is inherently a bit racy — if it ever leaves things
# stuck, run the script directly: scripts/switchyard-manage.sh restart

id: switchyard
name: Switchyard
description: Switchyard's own server process (self-managed)
icon: settings
type: command
group: infrastructure
tags: [switchyard, self]
enabled: true
workdir: ..

urls:
  - label: Dashboard
    url: http://127.0.0.1:7878/
    primary: true

# Host-neutral on purpose, unlike the thresholds you will write for your own
# services: these are absolute figures for a single Node process, and 100 % of one
# core or half a gigabyte of resident memory is wrong for a dashboard on any
# machine. The `command` provider measures the pid in the pid file and its
# threads, so nothing else on the box can push these numbers up.
monitoring:
  cpu:
    warning: 50%
    critical: 100%
    for: 1m
  memory:
    warning: 512MiB
    critical: 1GiB
    for: 1m

provider:
  status:
    run: [scripts/switchyard-manage.sh, status]
    interpret: exit
    successState: running
    failureState: stopped
    useStdoutAsSummary: true
  pidFile: .state/switchyard.pid
  logs:
    run: [scripts/switchyard-manage.sh, logs]
    tailArg: -n
    source: .state/switchyard.log
  actions:
    - id: start
      label: Start
      kind: primary
      run: [scripts/switchyard-manage.sh, start]
      enabledIn: [stopped, failed, unknown]
    - id: stop
      label: Stop
      kind: danger
      confirm: true
      description: stops the process serving this dashboard
      run: [scripts/switchyard-manage.sh, stop]
      enabledIn: [running, degraded]
    - id: restart
      label: Restart
      kind: secondary
      confirm: true
      run: [scripts/switchyard-manage.sh, restart]
