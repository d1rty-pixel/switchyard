# Shipped default: the Switchyard MCP server, as a managed daemon.
#
# Part of the default installation — the MCP endpoint is a first-class piece of
# Switchyard, so it is on the dashboard from the first start with its own status,
# actions and resource thresholds. Like every other service, Switchyard does not
# start it for you: press Start, or run `npm run mcp:http`.
#
# This definition manages the HTTP transport. The two transports are for different
# things:
#
#   project-local   stdio, via the committed .mcp.json. Claude Code spawns the
#                   process and it exits with the connection — no pid, no port,
#                   nothing for this file to manage.
#   global          HTTP on 127.0.0.1:7879/mcp, registered once at user scope with
#                   `npm run mcp:install` and reusable from every project, because
#                   a URL needs no path into this checkout. That is the daemon
#                   below.
#
# The endpoint binds loopback only, and that is hard-coded rather than configurable:
# it has no authentication and it can run every action your services declare, so
# there is deliberately no `allowRemoteBind` equivalent for it anywhere. See
# docs/PRIVILEGES.md.
#
# Like 00-switchyard.yaml, every path here is relative to this file, so it works in
# any checkout on any machine. Requires `npm run build` first.

id: switchyard-mcp
name: Switchyard MCP
description: MCP endpoint for this Switchyard, on port 7879
icon: git-branch
type: command
group: development
tags: [switchyard, mcp, self]
enabled: true
workdir: ..

urls:
  - label: MCP endpoint
    url: http://127.0.0.1:7879/mcp
    primary: true
  - label: Health
    url: http://127.0.0.1:7879/health

ports:
  - { port: 7879, label: mcp }

# Host-neutral, like 00-switchyard.yaml: this is one Node process holding no state
# and doing nothing between requests, so a tenth of a core sustained or a quarter of
# a gibibyte resident is wrong on any machine. The `command` provider measures the
# pid in the pid file and its threads.
monitoring:
  cpu:
    warning: 25%
    critical: 75%
    for: 1m
  memory:
    warning: 256MiB
    critical: 512MiB
    for: 1m

provider:
  status:
    run: [scripts/switchyard-mcp-manage.sh, status]
    interpret: exit
    successState: running
    failureState: stopped
    useStdoutAsSummary: true
  pidFile: .state/switchyard-mcp.pid
  logs:
    run: [scripts/switchyard-mcp-manage.sh, logs]
    tailArg: -n
    source: .state/switchyard-mcp.log
  actions:
    - id: start
      label: Start
      kind: primary
      icon: play
      run: [scripts/switchyard-mcp-manage.sh, start]
      enabledIn: [stopped, failed, unknown]
    - id: stop
      label: Stop
      kind: danger
      icon: square
      confirm: true
      description: disconnects any MCP client currently using this endpoint
      run: [scripts/switchyard-mcp-manage.sh, stop]
      enabledIn: [running, degraded]
    - id: restart
      label: Restart
      kind: secondary
      run: [scripts/switchyard-mcp-manage.sh, restart]
